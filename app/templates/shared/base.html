<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Case Studies{% endblock %} · Prozo</title>
  <link rel="stylesheet" href="/static/css/style.css?v={{ asset_version }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">prozo <span>EIR case studies</span></a>
    <nav>
      <a href="/" class="{{ 'active' if active == 'home' }}">Home</a>
      <a href="/case-study-1" class="{{ 'active' if active == 'cs1' }}">Case Study 1</a>
      <a href="/case-study-2" class="{{ 'active' if active == 'cs2' }}">Case Study 2</a>
      <a href="/case-study-3" class="{{ 'active' if active == 'cs3' }}">Case Study 3</a>
      <a href="/docs" target="_blank">API docs</a>
    </nav>
  </header>

  {% if in_memory_db %}
  <div class="banner">Demo mode: MongoDB is not connected, so results are kept in memory and lost when the app restarts.</div>
  {% endif %}

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/js/shared/common.js?v={{ asset_version }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
